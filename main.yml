---

- hosts: db
  remote_user: root
  tasks: 
  - name: Install MariaDB
    apt:
      name: mariadb-server
      state: present
      update_cache: yes
  - name: Start MariaDB
    service:
      name: mariadb
      state: started
      enabled: yes
      
  - name: Create db
    shell: mysql -e "CREATE DATABASE IF NOT EXISTS {{ db_name }}; CREATE USER IF NOT EXISTS '{{ db_user }}'@'%' IDENTIFIED BY '{{ db_pass }}'; GRANT ALL PRIVILEGES ON {{ db_name }}.* TO '{{ db_user }}'@'%'; FLUSH PRIVILEGES;"

  
-  hosts: server
   remote_user: root
   tasks:
     - name: Install Apache PHP Laravel Composer Node NPM
       apt:
         name:
           - apache2
           - php
           - composer
           - nodejs
           - npm
           - php-mbstring
           - php-xml
           - php-curl
           - php-bcmath
           - php-mysql
         state: present
         update_cache: yes
     - name: Clone GitHub repo
       git:
         repo: 'https://github.com/Practical-DevOps/app-for-devops'
         dest: /var/www/app
         force: yes
     - name: Create .env 
       copy:
         content: |
           APP_NAME=Laravel
           APP_ENV=local
           APP_KEY=
           APP_DEBUG=true
           APP_URL=http://localhost

           LOG_CHANNEL=stack
           LOG_DEPRECATIONS_CHANNEL=null
           LOG_LEVEL=debug

           DB_CONNECTION=mysql
           DB_HOST={{ db_host }}
           DB_PORT=3306
           DB_DATABASE={{ db_name }}
           DB_USERNAME={{ db_user }}
           DB_PASSWORD={{ db_pass }}

           BROADCAST_DRIVER=log
           CACHE_DRIVER=file
           FILESYSTEM_DISK=local
           QUEUE_CONNECTION=sync
           SESSION_DRIVER=file
           SESSION_LIFETIME=120

           MEMCACHED_HOST=127.0.0.1

           REDIS_HOST=127.0.0.1
           REDIS_PASSWORD=null
           REDIS_PORT=6379

           MAIL_MAILER=smtp
           MAIL_HOST=mailhog
           MAIL_PORT=1025
           MAIL_USERNAME=null
           MAIL_PASSWORD=null
           MAIL_ENCRYPTION=null
           MAIL_FROM_ADDRESS="hello@example.com"
           MAIL_FROM_NAME="${APP_NAME}"
         dest: /var/www/app/.env
     - name: Composer install
       shell: composer install --no-interaction
       args:
         chdir: /var/www/app
     - name: Generate app key
       shell: php artisan key:generate 
       args:
         chdir: /var/www/app
     - name: Run migrations
       shell: php artisan migrate --force
       args:
         chdir: /var/www/app
     - name: Configure Apache virtualhost
       copy:
         content: |
           <VirtualHost *:80>
               DocumentRoot /var/www/app/public
               <Directory /var/www/app/public>
                   AllowOverride All
                   Require all granted
               </Directory>
           </VirtualHost>
         dest: /etc/apache2/sites-available/app.conf
     - name: Enable mod_rewrite
       shell: a2enmod rewrite

     - name: Enable site
       shell: a2ensite app.conf

     - name: Disable default site
       shell: a2dissite 000-default.conf

     - name: Restart Apache
       service:
         name: apache2
         state: restarted
     - name: Set permissions
       file:
         path: "{{ item }}"
         mode: '0775'
         recurse: yes
       loop:
         - /var/www/app/storage
         - /var/www/app/bootstrap/cache


