---

- hosts: db
  become: yes
  tasks:
    - name: Install MariaDB
      apt:
        name:
          - mariadb-server
          - python3-pymysql
        state: present
        update_cache: yes

    - name: Start MariaDB
      service:
        name: mysql
        state: started
        enabled: yes

    - name: Create database
      mysql_db:
        login_user: root
        login_unix_socket: /var/run/mysqld/mysqld.sock
        name: "{{ db_name }}"
        state: present
        encoding: utf8

    - name: Create user
      mysql_user:
        login_user: root
        login_unix_socket: /var/run/mysqld/mysqld.sock
        name: "{{ db_user }}"
        password: "{{ db_pass }}"
        host: '%'
        priv: "{{ db_name }}.*:ALL"
        state: present

    - name: Configure MariaDB bind address
      copy:
        dest: /etc/mysql/my.cnf
        content: |
          [mysqld]
          bind-address=0.0.0.0
      notify: Restart MariaDB

  handlers:
    - name: Restart MariaDB
      service:
        name: mysql
        state: restarted

- hosts: server
  become: yes
  tasks:
    - name: Add PHP repository
      apt_repository:
        repo: ppa:ondrej/php

    - name: Download NodeSource setup
      uri:
        url: https://deb.nodesource.com/setup_22.x
        return_content: yes
      register: nodesource_setup

    - name: Run NodeSource setup
      shell:
        cmd: bash -s -- -y
        stdin: "{{ nodesource_setup.content }}"

    - name: Install packages
      apt:
        name:
          - apache2
          - nodejs
          - php
          - php-cli
          - php-curl
          - php-mbstring
          - php-xml
          - php-mysql
          - php-bcmath
        state: present
        update_cache: yes

    - name: Install Composer
      get_url:
        url: https://getcomposer.org/composer-stable.phar
        dest: /usr/local/bin/composer
        mode: '0755'

    - name: Clone GitHub repo
      git:
        repo: 'https://github.com/Practical-DevOps/app-for-devops'
        dest: ./devops_pract

    - name: Copy project to app folder
      copy:
        src: ./devops_pract/
        dest: /var/www/app
        remote_src: yes

    - name: Install PHP dependencies
      composer:
        command: install
        working_dir: /var/www/app
      environment:
        COMPOSER_ALLOW_SUPERUSER: 1

    - name: Install npm dependencies
      npm:
        path: /var/www/app

    - name: Create .env
      template:
        src: app.env.j2
        dest: /var/www/app/.env

    - name: Generate app key
      command:
        cmd: php artisan key:generate
        chdir: /var/www/app

    - name: Run migrations
      command:
        cmd: php artisan migrate --force
        chdir: /var/www/app

    - name: Build frontend
      command:
        cmd: npm run build
        chdir: /var/www/app

    - name: Remove node_modules
      file:
        path: /var/www/app/node_modules
        state: absent

    - name: Set owner
      file:
        path: /var/www/app
        owner: www-data
        group: www-data
        recurse: yes

    - name: Enable mod_rewrite
      apache2_module:
        name: rewrite

    - name: Configure Apache virtualhost
      template:
        src: apache.conf.j2
        dest: /etc/apache2/sites-available/app.conf
      notify: Restart Apache

    - name: Enable site
      command:
        cmd: a2ensite app
      notify: Restart Apache

    - name: Disable default site
      command:
        cmd: a2dissite 000-default
      notify: Restart Apache

  handlers:
    - name: Restart Apache
      service:
        name: apache2
        state: restarted
