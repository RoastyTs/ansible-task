---


- hosts: db
  become: yes 
  vars_files:
    - vars/db_vars.yml
  tasks:
    - name: Start message
      debug:
        msg: 'Create task to install and preparing DB server'

    - name: Generate for database
      set_fact:
        login_user: root
        login_pass: "{{ lookup('community.general.random_string') }}"
        root_pass: "{{ lookup('community.general.random_string') }}"
      
    
    - name: Install MariaDB
      apt:
        name:
          - mariadb-server
          - python3-pymysql
        state: present
        update_cache: yes
    
    - name: Start MariaDB
      service:
        name: mysql
        state: started
        enabled: yes

    - name: Set new password for root user
      community.mysql.mysql_user:
        name: "{{ login_user }}"
        password: "{{ login_pass }}"
        login_user: "{{ login_user }}"
        login_password: "{{ root_pass }}"
        login_unix_socket: /var/run/mysqld/mysqld.sock
        check_implicit_admin: yes

    - name: Create a new MariaDB database
      community.mysql.mysql_db:
        login_password: "{{ login_pass }}"
        login_user: "{{ login_user }}"
        name: "{{ db_name }}"
        state: present
        encoding: utf8
    
    - name: Create user for app
      community.mysql.mysql_user:
        login_password: "{{ login_pass }}"
        login_user: "{{ login_user }}"
        name: "{{ db_user }}"
        password: "{{ db_pass }}"
        host: '%'
        priv: "{{ db_name }}.*:ALL"
        state: present
     
    - name: Add custom config
      copy:
        dest: /etc/mysql/my.cnf
        content: |
          [mysqld]
          bind-address=0.0.0.0
      notify: Restart MariaDB

  handlers:            
    
    - name: Restart MariaDB
      service:
        name: mysql
        state: restarted
